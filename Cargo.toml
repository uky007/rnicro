[package]
name = "rnicro"
version = "0.1.0"
edition = "2021"
description = "A Linux x86_64 debugger and exploit development toolkit written in Rust"
license = "MIT"
repository = "https://github.com/uky007/rnicro"
homepage = "https://github.com/uky007/rnicro"
documentation = "https://docs.rs/rnicro"
readme = "README.md"
keywords = ["debugger", "exploit", "security", "ptrace", "reverse-engineering"]
categories = ["development-tools::debugging", "command-line-utilities"]
authors = ["uky"]
exclude = ["editors/code/node_modules/", "editors/code/package-lock.json", "target/"]

[dependencies]
# Process control (ptrace, signals, fork/exec)
nix = { version = "0.29", features = ["ptrace", "signal", "process"] }
libc = "0.2"

# ELF binary parsing
goblin = "0.9"
object = { version = "0.36", features = ["read"] }

# DWARF debug info
gimli = "0.31"
addr2line = "0.24"

# Disassembly
iced-x86 = { version = "1.21", features = ["std", "decoder", "intel", "gas"] }

# Memory-mapped I/O
memmap2 = "0.9"

# CLI / REPL
rustyline = "14"
clap = { version = "4", features = ["derive"] }
colored = "2"

# Rust/C++ symbol demangling
rustc-demangle = "0.1"
cpp_demangle = "0.4"

# Debug Adapter Protocol
dap = "0.4.1-alpha1"
serde_json = "1"
base64 = "0.22"

# Error handling
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
